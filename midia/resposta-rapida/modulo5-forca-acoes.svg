<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" font-family="Inter,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95ab"/></marker></defs><rect x="0" y="0" width="700" height="396" rx="18" fill="#16213a" stroke="none" stroke-width="2"/><text x="350.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e7ecf5">Força das ações</text><text x="350.0" y="64" text-anchor="middle" font-size="14" font-weight="400" fill="#8b95ab">Da mais forte para a mais fraca</text><rect x="30.0" y="80" width="640" height="46" rx="10" fill="#38bdf8" stroke="none" stroke-width="2"/><text x="350" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">1  Eliminar a causa (mudar o projeto)</text><rect x="70.0" y="136" width="560" height="46" rx="10" fill="#818cf8" stroke="none" stroke-width="2"/><text x="350" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">2  Impedir o erro (poka-yoke que trava)</text><rect x="110.0" y="192" width="480" height="46" rx="10" fill="#a78bfa" stroke="none" stroke-width="2"/><text x="350" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">3  Detectar e rejeitar (visão, sensor)</text><rect x="150.0" y="248" width="400" height="46" rx="10" fill="#fbbf24" stroke="none" stroke-width="2"/><text x="350" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">4  Inspeção manual 100%</text><rect x="190.0" y="304" width="320" height="46" rx="10" fill="#f87171" stroke="none" stroke-width="2"/><text x="350" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">5  Treinar e avisar</text><text x="350" y="376" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b8c2d6">Quanto mais forte a ação, menos ela depende da memória das pessoas</text></svg>