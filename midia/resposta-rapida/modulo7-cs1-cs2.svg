<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Inter,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95ab"/></marker></defs><rect x="0" y="0" width="700" height="400" rx="18" fill="#16213a" stroke="none" stroke-width="2"/><text x="350.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e7ecf5">Contenção controlada: CS1 e CS2</text><rect x="20" y="70" width="325" height="250" rx="12" fill="#1c2a48" stroke="#38bdf8" stroke-width="2.5"/><rect x="20" y="70" width="325" height="44" rx="12" fill="#38bdf8" stroke="none" stroke-width="2"/><text x="182" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1220">CS1  ·  Nível 1</text><text x="40" y="146" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Inspeção extra feita pelo</text><text x="40" y="174" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">próprio fornecedor</text><text x="40" y="202" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">100% da característica</text><text x="40" y="230" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">do problema</text><text x="40" y="258" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Área separada da produção</text><text x="40" y="286" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Relatório ao cliente</text><rect x="355" y="70" width="325" height="250" rx="12" fill="#1c2a48" stroke="#f87171" stroke-width="2.5"/><rect x="355" y="70" width="325" height="44" rx="12" fill="#f87171" stroke="none" stroke-width="2"/><text x="517" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1220">CS2  ·  Nível 2</text><text x="375" y="146" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Empresa independente</text><text x="375" y="174" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">faz a inspeção</text><text x="375" y="202" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Custo do fornecedor</text><text x="375" y="230" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">Cliente acompanha de perto</text><text x="375" y="258" text-anchor="start" font-size="15" font-weight="400" fill="#e7ecf5">É o nível mais sério</text><rect x="20" y="336" width="660" height="44" rx="10" fill="#2a3a5e" stroke="none" stroke-width="2"/><text x="350" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#e7ecf5">Saída: período sem defeito e causa raiz corrigida (critério do cliente)</text></svg>