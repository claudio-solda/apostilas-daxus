<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Inter,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95ab"/></marker></defs><rect x="0" y="0" width="700" height="500" rx="18" fill="#16213a" stroke="none" stroke-width="2"/><text x="350.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e7ecf5">5 Porquês na prática</text><text x="350.0" y="64" text-anchor="middle" font-size="14" font-weight="400" fill="#8b95ab">Exemplo ilustrativo aplicado à detecção</text><rect x="20" y="76" width="660" height="44" rx="12" fill="#2a1d2a" stroke="#f87171" stroke-width="2"/><text x="350" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#e7ecf5">Problema: peça sem porca chegou ao cliente</text><rect x="20" y="136" width="660" height="46" rx="10" fill="#1c2a48" stroke="#243252" stroke-width="1.5"/><circle cx="50" cy="159" r="15" fill="#a78bfa"/><text x="50" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">1</text><text x="78" y="164" text-anchor="start" font-size="14" font-weight="400" fill="#e7ecf5">Por que faltou a porca? A alimentação falhou naquele ciclo.</text><line x1="50" y1="182" x2="50" y2="192" stroke="#8b95ab" stroke-width="2"/><rect x="20" y="192" width="660" height="46" rx="10" fill="#1c2a48" stroke="#243252" stroke-width="1.5"/><circle cx="50" cy="215" r="15" fill="#a78bfa"/><text x="50" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">2</text><text x="78" y="220" text-anchor="start" font-size="14" font-weight="400" fill="#e7ecf5">Por que a peça seguiu? O sensor não acusou a falta.</text><line x1="50" y1="238" x2="50" y2="248" stroke="#8b95ab" stroke-width="2"/><rect x="20" y="248" width="660" height="46" rx="10" fill="#1c2a48" stroke="#243252" stroke-width="1.5"/><circle cx="50" cy="271" r="15" fill="#a78bfa"/><text x="50" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">3</text><text x="78" y="276" text-anchor="start" font-size="14" font-weight="400" fill="#e7ecf5">Por que não acusou? Ele conferia o conjunto, não cada porca.</text><line x1="50" y1="294" x2="50" y2="304" stroke="#8b95ab" stroke-width="2"/><rect x="20" y="304" width="660" height="46" rx="10" fill="#1c2a48" stroke="#243252" stroke-width="1.5"/><circle cx="50" cy="327" r="15" fill="#a78bfa"/><text x="50" y="333" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">4</text><text x="78" y="332" text-anchor="start" font-size="14" font-weight="400" fill="#e7ecf5">Por que só o conjunto? A detecção não foi revisada na automação.</text><line x1="50" y1="350" x2="50" y2="360" stroke="#8b95ab" stroke-width="2"/><rect x="20" y="360" width="660" height="46" rx="10" fill="#1c2a48" stroke="#243252" stroke-width="1.5"/><circle cx="50" cy="383" r="15" fill="#a78bfa"/><text x="50" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">5</text><text x="78" y="388" text-anchor="start" font-size="14" font-weight="400" fill="#e7ecf5">Por que não foi revisada? O FMEA não foi atualizado na mudança.</text><rect x="20" y="416" width="660" height="44" rx="10" fill="#38bdf8" stroke="none" stroke-width="2"/><text x="350" y="444" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b1220">Causa raiz (exemplo): mudança para o automático sem rever a detecção</text><text x="350" y="486" text-anchor="middle" font-size="12" font-weight="400" fill="#8b95ab">Exemplo para estudo. A causa real precisa ser comprovada no processo.</text></svg>